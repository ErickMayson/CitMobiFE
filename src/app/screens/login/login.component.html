<div class="login-container" [class.transitioning]="isTransitioning">
  <!-- Left Panel -->
  <div class="left-panel">
    <div class="logo-container flex justify-center items-center mb-6">
      <img
        src="assets/CitMobiLogo.svg"
        alt="CitMobi Logo"
        class="logo-icon w-24 h-24"
      />
    </div>
    <h1 class="tagline">Simplifique seu<br />workflow.</h1>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="form-container">
      <h2 class="welcome-title">Bem-vindo 👋</h2>
      <p class="welcome-subtitle">
        Para continuar, favor inserir suas credenciais abaixo.
      </p>

      <form (ngSubmit)="onLogin()" class="login-form">
        <!-- Email Input -->
        <div class="input-group">
          <input
            type="text"
            [(ngModel)]="login"
            name="email"
            placeholder="Login"
            class="input-field"
            required
          />
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <div class="password-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="senha"
              name="password"
              placeholder="Password"
              class="input-field"
              required
            />
            <button
              type="button"
              (click)="togglePasswordVisibility()"
              class="toggle-password"
              aria-label="Toggle password visibility"
            >
              <svg
                *ngIf="!showPassword"
                class="eye-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                *ngIf="showPassword"
                class="eye-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <line
                  x1="1"
                  y1="1"
                  x2="23"
                  y2="23"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <!-- Recuperacao de senha-->
        <div class="forgot-password-container">
          <a href="#" class="forgot-password">Esqueceu sua senha?</a>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-button">Entrar</button>
      </form>
    </div>
  </div>
</div>
